apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-service-config
  namespace: goodfood-dev
data:
  PORT: "8084"
  LOG_LEVEL: "info"
  MONGO_USER: "delivery_user"
  MONGO_INITDB_ROOT_USERNAME: "delivery_user"
  MONGO_INITDB_DATABASE: "delivery_db"
  ORDER_SERVICE_URL: "http://order-service:80"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  FRANCHISE_SERVICE_URL: "http://franchise-service:80"
  REDIS_URL: "redis://redis:6379/1"
  NODE_ENV: "production"
  RECONCILE_INTERVAL_MS: "60000"
  PUSH_RADIUS_KM: "8"
