apiVersion: v1
kind: ConfigMap
metadata:
  name: reservation-service-config
  namespace: goodfood-dev
data:
  PORT: "8088"
  LOG_LEVEL: "info"
  MONGO_USER: "reservation_user"
  MONGO_INITDB_ROOT_USERNAME: "reservation_user"
  MONGO_INITDB_DATABASE: "reservation_db"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  FRANCHISE_SERVICE_URL: "http://franchise-service:80"
