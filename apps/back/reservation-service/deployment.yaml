apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service # Remplacez par le nom de votre microservice (ex: api-gateway, auth-service)
  namespace: goodfood-dev # Remplacez par le nom de votre namespace
  labels:
    app: reservation-service
spec:
  # Replicas are managed by the HorizontalPodAutoscaler (hpa.yaml).
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      # Spread replicas over nodes: losing one node never takes the service down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: reservation-service
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-c-mbk-secret
      containers:
        - name: reservation-service
          # C'est cette ligne que GitHub Actions mettra à jour à chaque commit !
          image: registry.c-mbk.fr/reservation-service:v0.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8088 # Le port sur lequel votre conteneur écoute (ex: 80, 3000, 8080)
          envFrom:
            - configMapRef:
                name: reservation-service-config
            - secretRef:
                name: reservation-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8088
            periodSeconds: 5
            failureThreshold: 30
