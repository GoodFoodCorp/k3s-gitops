apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: goodfood-dev
data:
  PORT: "8082"
  LOG_LEVEL: "info"
  POSTGRES_USER: "order_user"
  POSTGRES_DB: "orders_db"
  STOCK_SERVICE_URL: "http://stock-service:80"
  MENU_SERVICE_URL: "http://menu-service:80"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  PAYMENT_SERVICE_URL: "http://payment-service:80"
  PROMO_SERVICE_URL: "http://promo-service:80"
  FRANCHISE_SERVICE_URL: "http://franchise-service:80"
  # Invoices emailed once an order is paid.
  # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD: order-service-secret
  SMTP_SENDER: "Good Food <no-reply@c-mbk.fr>"
  FRONTEND_URL: "https://app.c-mbk.fr"
  INVOICE_COMPANY_NAME: "Good Food"
  INVOICE_COMPANY_ADDRESS: "12 rue de la République, 75011 Paris"
  # INVOICE_COMPANY_SIRET / INVOICE_COMPANY_VAT_NUMBER: the company's real numbers
