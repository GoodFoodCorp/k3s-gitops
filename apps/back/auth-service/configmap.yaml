apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: goodfood-dev
data:
  PORT: "8081"
  ENV: "development"
  POSTGRES_USER: "user"
  POSTGRES_DB: "auth_db"
  SMTP_HOST: "sandbox.smtp.mailtrap.io"
  SMTP_PORT: "2525"
  SMTP_SENDER: "no-reply@your-domain.com"
  USER_SERVICE_URL: "http://user-service:80"
  FRONTEND_URL: "https://app.c-mbk.fr"
  OAUTH_REDIRECT_BASE_URL: "https://app.c-mbk.fr"
  FRANCHISE_SERVICE_URL: "http://franchise-service:80"
  AUTO_VERIFY_EMAIL: "true"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  REDIS_URL: "redis://redis:6379/0"
  COOKIE_SECURE: "true"
