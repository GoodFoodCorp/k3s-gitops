apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: goodfood-dev
data:
  PORT: "8087"
  LOG_LEVEL: "info"
  POSTGRES_USER: "user_user"
  POSTGRES_DB: "user_db"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  ENV: "production"
  # Avatars in the shared MinIO bucket (S3_ACCESS_KEY / S3_SECRET_KEY in
  # user-service-secret), served by the ingress at /avatars.
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "avatars"
  S3_USE_SSL: "false"
  S3_PUBLIC_URL: "https://app.c-mbk.fr/avatars"
