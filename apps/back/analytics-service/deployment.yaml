apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: goodfood-dev
  labels:
    app: analytics-service
spec:
  # Replicas are managed by the HorizontalPodAutoscaler (hpa.yaml).
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      # Spread replicas over nodes: losing one node never takes the service down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: analytics-service
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-c-mbk-secret
      containers:
        - name: analytics-service
          image: registry.c-mbk.fr/analytics-service:v0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-service-secret
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: analytics-service-config
            - secretRef:
                name: analytics-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8091
            periodSeconds: 5
            failureThreshold: 30
