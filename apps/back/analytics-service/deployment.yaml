apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: goodfood-dev
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      imagePullSecrets:
        - name: registry-c-mbk-secret
      containers:
        - name: analytics-service
          image: registry.c-mbk.fr/analytics-service:v0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-service-secret
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: analytics-service-config
            - secretRef:
                name: analytics-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
