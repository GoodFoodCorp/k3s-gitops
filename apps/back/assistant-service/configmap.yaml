apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-service-config
  namespace: goodfood-dev
data:
  PORT: "8093"
  LOG_LEVEL: "info"
  AI_BASE_URL: ""
  AI_MODEL: "gpt-4o-mini"
  ORDER_SERVICE_URL: "http://order-service:80"
  MENU_SERVICE_URL: "http://menu-service:80"
  PAYMENT_SERVICE_URL: "http://payment-service:80"
  USER_SERVICE_URL: "http://user-service:80"
  FRANCHISE_SERVICE_URL: "http://franchise-service:80"
  AI_TIMEOUT_SECONDS: "60"
  AI_SETTINGS_FILE: "/data/ai-settings.json"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
