apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-service
  namespace: goodfood-dev
  labels:
    app: assistant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-service
  template:
    metadata:
      labels:
        app: assistant-service
    spec:
      imagePullSecrets:
        - name: registry-c-mbk-secret
      containers:
        - name: assistant-service
          image: registry.c-mbk.fr/assistant-service:v0.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: assistant-service-config
            - secretRef:
                name: assistant-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8093
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8093
            periodSeconds: 5
            failureThreshold: 30
