# 1. PVC pour conserver les données de Postgres sur k3s
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-db-pvc
  namespace: goodfood-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi # Ajustez la taille selon vos besoins
---
# 2. Déploiement de PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-db
  namespace: goodfood-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-db
  template:
    metadata:
      labels:
        app: payment-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            # Récupère POSTGRES_USER et POSTGRES_DB
            - configMapRef:
                name: payment-service-config
            # Récupère POSTGRES_PASSWORD
            - secretRef:
                name: payment-service-secret
          volumeMounts:
            - name: payment-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: payment-db-data
          persistentVolumeClaim:
            claimName: payment-db-pvc
---
# 3. Service Kubernetes pour permettre à payment-service de trouver payment-db
apiVersion: v1
kind: Service
metadata:
  name: payment-db # Ce nom permet de la contacter via "host=payment-db"
  namespace: goodfood-dev
spec:
  selector:
    app: payment-db
  ports:
    - port: 5432
      targetPort: 5432
