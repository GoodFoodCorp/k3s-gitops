apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: goodfood-dev
data:
  PORT: "8086"
  LOG_LEVEL: "info"
  POSTGRES_USER: "payment_user"
  POSTGRES_DB: "payment_db"
  JWT_ISSUER: "goodfood-auth"
  JWT_AUDIENCE: "goodfood-api"
  # Refuses the fake gateway: STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET
  # are required in payment-service-secret.
  ENV: "production"
