apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-datasources
  namespace: goodfood-dev
data:
  data-sources.json: |
    {
      "folders": {},
      "connections": {
        "auth-db": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Auth DB",
          "save-password": true,
          "configuration": {
            "host": "auth-db",
            "port": "5432",
            "database": "auth_db",
            "url": "jdbc:postgresql://auth-db:5432/auth_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "auth_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        },
        "menu-db": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Menu DB",
          "save-password": true,
          "configuration": {
            "host": "menu-db",
            "port": "5432",
            "database": "menu_db",
            "url": "jdbc:postgresql://menu-db:5432/menu_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "menu_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        },
        "order-db": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Order DB",
          "save-password": true,
          "configuration": {
            "host": "order-db",
            "port": "5432",
            "database": "orders_db",
            "url": "jdbc:postgresql://order-db:5432/orders_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "order_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        },
        "payment-db": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Payment DB",
          "save-password": true,
          "configuration": {
            "host": "payment-db",
            "port": "5432",
            "database": "payment_db",
            "url": "jdbc:postgresql://payment-db:5432/payment_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "payment_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        },
        "stock-db": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "Stock DB",
          "save-password": true,
          "configuration": {
            "host": "stock-db",
            "port": "5432",
            "database": "stock_db",
            "url": "jdbc:postgresql://stock-db:5432/stock_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "stock_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        },
        "reservation-db": {
          "provider": "generic",
          "driver": "mongo_node",
          "name": "Reservation DB (MongoDB)",
          "save-password": true,
          "configuration": {
            "host": "reservation-db",
            "port": "27017",
            "database": "reservation_db",
            "url": "mongodb://reservation-db:27017/reservation_db",
            "configurationType": "MANUAL",
            "auth-model": "native",
            "auth-properties": {
              "user": "reservation_user",
              "password": "votre_vrai_mot_de_passe"
            }
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: goodfood-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
          volumeMounts:
            # Monte le fichier de config pré-rempli au bon endroit
            - name: datasources-volume
              mountPath: /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json
              subPath: data-sources.json
      volumes:
        - name: datasources-volume
          configMap:
            name: cloudbeaver-datasources
