# 1. Stockage pour sauvegarder les configurations de connexion et utilisateurs CloudBeaver
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-data-pvc
  namespace: goodfood-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Déploiement CloudBeaver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: goodfood-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      # 1. L'initContainer prépare le dossier et copie le JSON avant que CloudBeaver ne démarre
      initContainers:
        - name: init-datasources
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /workspace/GlobalConfiguration/.dbeaver
              cp /config/data-sources.json /workspace/GlobalConfiguration/.dbeaver/data-sources.json
              chmod -R 777 /workspace/GlobalConfiguration
          volumeMounts:
            - name: cloudbeaver-data
              mountPath: /workspace
            - name: config-source
              mountPath: /config
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
          volumeMounts:
            - name: cloudbeaver-data
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: cloudbeaver-data
          persistentVolumeClaim:
            claimName: cloudbeaver-data-pvc
        - name: config-source
          configMap:
            name: cloudbeaver-datasources
---
# 3. Service interne
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: goodfood-dev
spec:
  selector:
    app: cloudbeaver
  ports:
    - port: 8978
      targetPort: 8978
---
# 4. Ingress Traefik pour y accéder depuis le navigateur
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbeaver-ingress
  namespace: goodfood-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: db.c-mbk.fr # <--- Change par le sous-domaine de ton choix
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbeaver
                port:
                  number: 8978
