# 1. Stockage pour sauvegarder les configurations de connexion et utilisateurs CloudBeaver
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-data-pvc
  namespace: goodfood-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Déploiement CloudBeaver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: goodfood-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: cloudbeaver-data
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: cloudbeaver-data
          persistentVolumeClaim:
            claimName: cloudbeaver-data-pvc
---
# 3. Service interne
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: goodfood-dev
spec:
  selector:
    app: cloudbeaver
  ports:
    - port: 8978
      targetPort: 8978
---
# 4. Ingress Traefik pour y accéder depuis le navigateur
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbeaver-ingress
  namespace: goodfood-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: db.c-mbk.fr # <--- Change par le sous-domaine de ton choix
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbeaver
                port:
                  number: 8978
